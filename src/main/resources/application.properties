spring.application.name=backend

spring.datasource.url=${POSTGRES_DB_URL}
spring.datasource.username=${POSTGRES_USERNAME}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.mail.host: ${JAVA_MAIL_HOST}
spring.mail.port: ${JAVA_MAIL_PORT}
spring.mail.username: ${JAVA_MAIL_USERNAME}
spring.mail.password: ${JAVA_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth: true
spring.mail.properties.mail.smtp.starttls.enable: true

# Use Hibernate's validation to ensure our Java entities match our Docker schema
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect